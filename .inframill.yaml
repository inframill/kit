# Default configuration for the Inframill Kit image.
# Mount a replacement at /etc/inframill/inframill.yaml to customize it.
main:
  port: 8080
  shutdownTimeout: 10s
  readHeaderTimeout: 5s
  readTimeout: 15s
  writeTimeout: 30s
  idleTimeout: 60s

logger:
  type: slog
  settings:
    level: info
    format: json

engine:
  dataDir: /var/lib/inframill
  localBlueprintPaths:
    - /opt/inframill/blueprints
  providers:
    debug:
      path: /usr/local/bin/inframill
      args: [debug, provider]
    opentofu:
      path: /usr/local/bin/kit-exec
      args:
        - opentofu-0.4.0
        - --tool
        - /opt/inframill/tools/opentofu/1.11.5/tofu
    ansible:
      path: /usr/local/bin/kit-exec
      args:
        - ansible-0.4.0
        - --tool
        - /opt/inframill/tools/ansible/2.20.1/bin/ansible-playbook
    dispatch:
      path: /usr/local/bin/kit-exec
      args: [dispatch-0.1.0]

handlers:
  - type: connect-engine

workers: []
