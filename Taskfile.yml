version: '3'

includes:
  providers:
    taskfile: ./providers/Taskfile.yml
    dir: ./providers

# Kit and image releases always use the root VERSION file.
env:
  PROVIDERS_DIST_DIR: '{{default "providers/dist" .PROVIDERS_DIST_DIR}}'
  INFRAMILL_DIST_DIR: '{{default "../inframill/dist" .INFRAMILL_DIST_DIR}}'
  KIT_DIST_DIR: '{{default "dist" .KIT_DIST_DIR}}'
  REGISTRY: '{{default "ghcr.io" .REGISTRY}}'
  NAMESPACE: '{{default "inframill" .NAMESPACE}}'
  REFERENCE: '{{default "" .REFERENCE}}'

tasks:
  default:
    aliases: [help]
    desc: Show tasks, examples and version selectors
    silent: true
    cmds:
      - task --list --sort none
      - |
        printf '%s\n' \
          '' \
          'Start:     task providers:build && task bundle' \
          'Check:     task check-fast' \
          'Image:     task bundle && task check-full' \
          'Run:       task docker:up' \
          'Stop:      task docker:down' \
          'Publish:   docker login ghcr.io && task bundle:push' \
          'Release:   task release (prepare metadata, build and check; then bundle:push)' \
          'Blueprint: inframill blueprint fetch local:pv-cloud --namespace production' \
          '' \
          'Versions: root VERSION file=Kit/image; blueprints are local source directories;' \
          '          providers/releases.json=providers. Kit/image version overrides are ignored.' \
          'Registry: REGISTRY=ghcr.io NAMESPACE=inframill; image repository is /kit.' \
          'Builds stay local. Push tasks upload existing artifacts.' \
          '' \
          'Details: task --summary TASK; docs/usage.md; docs/releases.md'

  # Local development.
  setup:
    desc: Install pinned tools in .cache; automatically find Python 3.12–3.14
    summary: |
      Finds a supported Python for Ansible even if python3 is the system Python 3.9.
      Uses the current interpreter when supported, otherwise tries python3.14,
      python3.13 and python3.12 on PATH. Set PYTHON=/path/to/python to override.
      Installs tools locally in .cache; leaves the system Python unchanged.
    cmds: ['python3 build.py setup']
  inframill:copy:
    desc: Generate a missing release lock, then verify and copy the prebuilt host engine
    cmds: ['python3 build.py copy-engine']
  config:
    desc: Print local engine JSON configuration using native providers/dist outputs
    cmds: ['python3 build.py config']

  docker:up:
    desc: Pull the current Kit version and recreate the local Inframill container
    dir: '{{.ROOT_DIR}}'
    summary: |
      Pulls ghcr.io/inframill/kit using the root VERSION file before stopping Inframill.
      Binds .inframill, .inframill.yaml and local blueprints from the repository root; publishes
      port 8080 on loopback. Creates the data directory if needed.
    preconditions:
      - sh: test -f .inframill.yaml
        msg: Create .inframill.yaml before running task docker:up.
    cmds:
      - |
        set -eu
        image="ghcr.io/inframill/kit:$(cat VERSION)"
        docker pull "$image"
        mkdir -p .inframill
        if docker container inspect inframill >/dev/null 2>&1; then
          docker stop inframill
          docker rm inframill
        fi
        docker run -d --name inframill --restart unless-stopped \
          -p 127.0.0.1:8080:8080 \
          -v "$PWD/.inframill:/var/lib/inframill" \
          -v "$PWD/.inframill.yaml:/etc/inframill/inframill.yaml" \
          -v "$PWD/blueprints:/opt/inframill/blueprints:ro" \
          "$image"

  docker:down:
    desc: Stop and remove the local Inframill container, preserving its data
    summary: |
      Stops and removes the inframill container if it exists.
      Keeps .inframill/, .inframill.yaml and the downloaded image.
    cmds:
      - |
        set -eu
        docker info >/dev/null
        if docker container inspect inframill >/dev/null 2>&1; then
          docker stop inframill
          docker rm inframill
        fi

  # Verification: full checks require an already-built image.
  check-fast:
    desc: Run image tooling and provider tests and validate release versions
    cmds:
      - python3 build.py test
      - python3 providers/build.py test
      - task: release:check
  check-full:
    desc: Run fast checks, native workflows and both Linux images in a disposable registry
    summary: |
      Prerequisites: task setup, task providers:build -- --native, Docker, and task bundle.
      Runs local resources, provider mocks, daemon and registry checks, then
      ARM64/AMD64 image workflows. Creates no cloud resources or GHCR packages.
    cmds:
      - task: check-fast
      - task: inframill:copy
      - python3 tests/check.py full
  release:check:
    desc: Validate the selected image release and provider selections
    cmds: ['python3 build.py validate']
  release:prepare:
    desc: Generate VERSION, image lock and SDK pin from the sibling Inframill release
    summary: |
      Requires a clean Inframill checkout and its four prebuilt release binaries.
      Defaults Kit's version to Inframill VERSION; override with -- --version X.Y.Z.
      Refuses to replace an existing lock with different inputs. Does not pull or publish.
    cmds: ['python3 build.py prepare-release {{.CLI_ARGS}}']
  release:
    desc: Prepare release metadata, refresh providers, build the image and run full checks
    summary: |
      First build the new release in ../inframill and run task setup once in Kit.
      Requires Docker. Updates release metadata, rebuilds stale provider outputs with
      backups, builds the image and runs check-full. Publish with task bundle:push.
    cmds:
      - task: release:prepare
        vars: {CLI_ARGS: '{{.CLI_ARGS}}'}
      - python3 providers/build.py build --refresh --dist "$PROVIDERS_DIST_DIR"
      - python3 providers/build.py build --native --refresh --dist "$PROVIDERS_DIST_DIR"
      - task: build
      - task: check-full
  # The bundle is the Kit image: engine, providers and pinned tools for both platforms.
  build:
    aliases: [bundle]
    desc: Build the local Linux AMD64/ARM64 Kit image (VERSION file)
    summary: |
      Requires Docker Buildx, prebuilt providers under PROVIDERS_DIST_DIR (providers/dist),
      and Linux engine binaries under INFRAMILL_DIST_DIR. Never compiles providers.
      Includes /etc/inframill/inframill.yaml; mount data at /var/lib/inframill.
      Writes KIT_DIST_DIR/bundles/<VERSION>; never pushes or replaces an output.
    cmds: ['python3 build.py build']
  push:
    aliases: [bundle:push]
    desc: Push the existing Kit image to REGISTRY/NAMESPACE/kit (VERSION file)
    summary: |
      Authenticate first with docker login REGISTRY, then run task bundle:push.
      Validates release versions and the build lock, uploads existing OCI bytes,
      and rejects a version tag that already points to different content.
    cmds: ['python3 build.py push']
  verify:
    aliases: [bundle:verify]
    desc: Check published image platforms and provider discovery (REFERENCE)
    summary: |
      Uses Docker to inspect and run the published image. REFERENCE must be pinned:
        task bundle:verify REFERENCE=ghcr.io/inframill/kit@sha256:...
    cmds: ['python3 build.py verify --reference "{{.REFERENCE}}"']

  test:
    desc: Test the root Python image builder
    cmds: ['python3 build.py test']
