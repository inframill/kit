version: '3'

includes:
  drivers:
    taskfile: ./drivers/Taskfile.yml
    dir: ./drivers
  blueprints:
    taskfile: ./blueprints/Taskfile.yml
    dir: ./blueprints

# Kit and image releases always use the root VERSION file.
env:
  DRIVERS_DIST_DIR: '{{default "drivers/dist" .DRIVERS_DIST_DIR}}'
  INFRAMILL_DIST_DIR: '{{default "../inframill/dist" .INFRAMILL_DIST_DIR}}'
  KIT_DIST_DIR: '{{default "dist" .KIT_DIST_DIR}}'
  REGISTRY: '{{default "ghcr.io" .REGISTRY}}'
  NAMESPACE: '{{default "inframill" .NAMESPACE}}'
  PLAIN_HTTP: '{{default "false" .PLAIN_HTTP}}' # Local test registries only.
  REFERENCE: '{{default "" .REFERENCE}}'

tasks:
  default:
    aliases: [help]
    desc: Show tasks, examples and version selectors
    silent: true
    cmds:
      - task --list --sort none
      - |
        printf '%s\n' \
          '' \
          'Start:     task drivers:build && task bundle' \
          'Check:     task check-fast' \
          'Image:     task bundle && task check-full' \
          'Publish:   docker login ghcr.io && task bundle:push' \
          'Blueprint: task blueprints:build' \
          '' \
          'Versions: root VERSION file=Kit/image; blueprints/releases.json=blueprints;' \
          '          drivers/releases.json=drivers. Kit/image version overrides are ignored.' \
          'Registry: REGISTRY=ghcr.io NAMESPACE=inframill; image repository is /kit.' \
          'Builds stay local. Push tasks upload existing artifacts.' \
          '' \
          'Details: task --summary TASK; docs/usage.md; docs/releases.md'

  # Local development.
  setup:
    desc: Install pinned tools in .cache; automatically find Python 3.12–3.14
    summary: |
      Finds a supported Python for Ansible even if python3 is the system Python 3.9.
      Uses the current interpreter when supported, otherwise tries python3.14,
      python3.13 and python3.12 on PATH. Set PYTHON=/path/to/python to override.
      Installs tools locally in .cache; leaves the system Python unchanged.
    cmds: ['python3 scripts/setup-dev.py']
  build:
    desc: Assemble the Kit image from prebuilt drivers/dist outputs
    cmds:
      - task: bundle
  inframill:copy:
    desc: Verify and copy the prebuilt host engine from the sibling dist (VERSION file)
    cmds: ['go run ./cmd/kit-build inframill:copy']
  config:
    desc: Print local engine JSON configuration using native drivers/dist outputs
    cmds: ['python3 scripts/check.py config']

  # Verification: full checks require an already-built image.
  check-fast:
    desc: Run image tooling, driver and blueprint tests and validate release versions
    cmds:
      - python3 -m unittest discover -s scripts -p "test_*.py"
      - task: blueprints:test
      - task: drivers:test
      - go test -vet=off ./...
      - task: release:check
  check-full:
    desc: Run fast checks, native workflows and both Linux images in a disposable registry
    summary: |
      Prerequisites: task setup, task drivers:build -- --native, Docker, and task bundle.
      Runs local resources, provider mocks, daemon and registry checks, then
      ARM64/AMD64 image workflows. Creates no cloud resources or GHCR packages.
    cmds:
      - task: check-fast
      - task: inframill:copy
      - python3 scripts/check.py full
  release:check:
    desc: Validate the selected image release and driver selections
    cmds: ['go run ./cmd/kit-build bundle:validate']
  # The bundle is the Kit image: engine, drivers and pinned tools for both platforms.
  bundle:
    desc: Build the local Linux AMD64/ARM64 Kit image (VERSION file)
    summary: |
      Requires Docker Buildx, prebuilt drivers under DRIVERS_DIST_DIR (drivers/dist),
      and Linux engine binaries under INFRAMILL_DIST_DIR. Never compiles drivers.
      Includes /etc/inframill/inframill.yaml; mount data at /var/lib/inframill.
      Writes KIT_DIST_DIR/bundles/<VERSION>; never pushes or replaces an output.
    cmds: ['python3 scripts/bundle.py']
  bundle:push:
    desc: Push the existing Kit image to REGISTRY/NAMESPACE/kit (VERSION file)
    summary: |
      Authenticate first with docker login REGISTRY, then run task bundle:push.
      Validates release versions and the build lock, uploads existing OCI bytes,
      and rejects a version tag that already points to different content.
    cmds: ['go run ./cmd/kit-build bundle:push']
  bundle:verify:
    desc: Check published image platforms and driver discovery (REFERENCE)
    summary: |
      Uses Docker to inspect and run the published image. REFERENCE must be pinned:
        task bundle:verify REFERENCE=ghcr.io/inframill/kit@sha256:...
    cmds: ['python3 scripts/check.py bundle:verify']
