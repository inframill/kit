version: '3'

set: [pipefail]

env:
  PYTHONDONTWRITEBYTECODE: '1'

tasks:
  default:
    desc: List focused external jobs and local operations
    silent: true
    cmds: ['task --list']

  setup:
    desc: Install pinned OpenTofu and Ansible into .cache
    cmds: ['python3 -m scripts.kit.runtime setup']

  dev:sync:
    desc: Import Runmill, engine binaries and runtime pins from ../inframill (INFRAMILL_DIR overrides)
    env:
      INFRAMILL_SOURCE: '{{.INFRAMILL_DIR | default "../inframill"}}'
      GOWORK: 'off'
    cmds: ['python3 -m scripts.kit.dev']

  dev:prepare:
    desc: Sync Runmill/engine pins, install pinned tools, build binaries and write native dev config
    env:
      GOWORK: 'off'
      INFRAMILL_SOURCE: '{{.INFRAMILL_DIR | default "../inframill"}}'
    cmds:
      - python3 -m scripts.kit.engine build
      - task: dev:sync
      - task: setup
      - toolai go build
      - toolai go build --native --output bin/kit-exec
      - python3 -m scripts.kit.runtime config --output .build/dev/inframill.json

  config:
    desc: Print native configuration using prepared binaries and local tools
    cmds: ['python3 -m scripts.kit.runtime config']

  build:prepare:
    desc: Record the source inputs before Toolai builds binaries
    cmds: ['python3 -m scripts.kit.bundle capture']

  build:engine:
    desc: Import and verify pinned sibling engine binaries and dependency notices
    env:
      INFRAMILL_SOURCE: '{{.INFRAMILL_DIR | default "../inframill"}}'
    cmds: ['python3 -m scripts.kit.engine']

  build:image:
    desc: Package prepared provider/engine binaries and load the local image
    cmds: ['python3 -m scripts.kit.bundle image']

  build:release:
    desc: Assemble a self-contained release bundle from the prepared image
    cmds: ['python3 -m scripts.kit.bundle release']

  release:verify:
    desc: Verify an existing release bundle without source or engine checkouts
    cmds: ['python3 -m scripts.kit.bundle verify {{.CLI_ARGS}}']

  release:load:
    desc: Verify and load an existing release bundle
    cmds: ['python3 -m scripts.kit.bundle load {{.CLI_ARGS}}']

  release:push:
    desc: Verify and publish the existing bundle (requires registry login)
    cmds: ['python3 -m scripts.kit.bundle push {{.CLI_ARGS}}']

  check:python:
    desc: Run Python packaging, runtime, and blueprint unit tests
    cmds: ['python3 -B -m unittest discover -s tests -p "test_*.py"']

  test:native:
    desc: Run native acceptance against prepared binaries and installed local tools
    # Compose must not read the terminal from Toolai's separate process group.
    cmds:
      - python3 tests/check.py native < /dev/null
      - python3 tests/pv_postgres_check.py < /dev/null
      - python3 tests/pv_millway_check.py < /dev/null

  test:image:
    desc: Verify the prepared release in a disposable registry and both Linux runtimes
    cmds: ['python3 tests/check.py image']

  docker:up:
    desc: Start the prepared local Kit image with persistent repository data
    preconditions:
      - sh: test -f .inframill.yaml
        msg: Create .inframill.yaml first.
    cmds:
      - |
        set -eu
        image=$(python3 -c 'from scripts.kit.project import image_reference; print(image_reference())')
        docker image inspect "$image" >/dev/null
        agent="${SSH_AUTH_SOCK:-}"
        if [ -n "$agent" ] && [ "$(uname -s)" = Darwin ]; then
          agent=/run/host-services/ssh-auth.sock
        fi
        agent="${KIT_SSH_AUTH_SOCK-$agent}"
        set --
        if [ -n "$agent" ]; then
          set -- --mount "type=bind,src=$agent,dst=/run/kit-ssh-agent.sock" -e SSH_AUTH_SOCK=/run/kit-ssh-agent.sock
        fi
        mkdir -p .inframill
        mkdir -p -m 700 ssh
        if docker container inspect inframill >/dev/null 2>&1; then
          docker stop inframill
          docker rm inframill
        fi
        docker run -d --pull=never --name inframill --restart unless-stopped -p 127.0.0.1:8080:8080 \
          -v "$PWD/.inframill:/var/lib/inframill" -v "$PWD/.inframill.yaml:/etc/inframill/inframill.yaml" \
          -v "$PWD/blueprints:/opt/inframill/blueprints:ro" -v "$PWD/ssh:/root/.ssh" "$@" "$image"

  docker:down:
    desc: Stop the local container and preserve its data
    cmds:
      - |
        set -eu
        docker info >/dev/null
        if docker container inspect inframill >/dev/null 2>&1; then
          docker stop inframill
          docker rm inframill
        fi
