# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3.53.1'

vars:
  CACHE_ROOT: '{{default "/tmp/inframill-check-cache" .CACHE_ROOT}}'
  GO_BUILD_CACHE: '{{default (printf "%s/go-build" .CACHE_ROOT) .GOCACHE}}'
  GO_LINT_CACHE: '{{default (printf "%s/golangci-lint" .CACHE_ROOT) .GOLANGCI_LINT_CACHE}}'
  # The user-managed pkg/harness copy is excluded from tests and formatting.
  GO_UNIT_PACKAGES: ./cmd/... ./internal/... ./pkg/inframill/... ./pkg/driver/...
  GO_PACKAGES: '{{.GO_UNIT_PACKAGES}} ./tests/cli/... ./tests/engine/fixture/...'
  GO_SOURCE_ROOTS: cmd internal pkg/inframill pkg/driver tests/cli tests/engine/fixture

env:
  GOCACHE: '{{.GO_BUILD_CACHE}}'
  GOLANGCI_LINT_CACHE: '{{.GO_LINT_CACHE}}'
  INFRAMILL_BINARY_OUTPUT: '{{default "dist/inframill" .OUTPUT}}'

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - task --list

  # Binary lifecycle
  build:
    desc: Build the native binary (OUTPUT=dist/inframill)
    env:
      CGO_ENABLED: '0'
    cmds:
      - mkdir -p "$(dirname "$INFRAMILL_BINARY_OUTPUT")"
      - GOOS="$(go env GOHOSTOS)" GOARCH="$(go env GOHOSTARCH)" go build -trimpath -buildvcs=false -o "$INFRAMILL_BINARY_OUTPUT" ./cmd

  release:
    desc: Build macOS/Linux amd64/arm64 binaries (VERSION required, optional DIST_DIR)
    env:
      CGO_ENABLED: '0'
      INFRAMILL_BINARY_VERSION: '{{default "" .VERSION}}'
      INFRAMILL_BINARY_DIST_DIR: '{{default "dist" .DIST_DIR}}'
    cmds:
      - |
        set -eu
        case "$INFRAMILL_BINARY_VERSION" in
          ''|[!a-zA-Z0-9]*|*[!a-zA-Z0-9._+-]*)
            echo 'VERSION is required and must be filename-safe, starting with a letter or digit' >&2
            exit 1 ;;
        esac
        release_dir="$INFRAMILL_BINARY_DIST_DIR/$INFRAMILL_BINARY_VERSION"
        mkdir -p "$INFRAMILL_BINARY_DIST_DIR"
        mkdir "$release_dir"
        for target_os in darwin linux; do
          for target_arch in amd64 arm64; do
            echo "Building $target_os/$target_arch"
            GOOS="$target_os" GOARCH="$target_arch" go build -trimpath -buildvcs=false \
              -ldflags="-s -w -X main.version=$INFRAMILL_BINARY_VERSION" \
              -o "$release_dir/inframill_${INFRAMILL_BINARY_VERSION}_${target_os}_${target_arch}" ./cmd
          done
        done

  install:
    desc: Build and install locally (INSTALL_DIR=~/.local/bin)
    env:
      INFRAMILL_BINARY_INSTALL_DIR: '{{default "" .INSTALL_DIR}}'
    cmds:
      - task: build
      - |
        set -eu
        install_dir="${INFRAMILL_BINARY_INSTALL_DIR:-$HOME/.local/bin}"
        install -d "$install_dir"
        install -m 0755 "$INFRAMILL_BINARY_OUTPUT" "$install_dir/inframill"
        echo "$install_dir/inframill"

  run:
    desc: Build and start the server using .inframill.yaml
    interactive: true
    cmds:
      - task: build
      - '"$INFRAMILL_BINARY_OUTPUT" server'

  # The only test/check entry points. No lint tools run through either gate.
  check-fast:
    desc: Clean/regenerate Go bindings, compile to /dev/null and run package tests
    cmds:
      - task: connect:generate
      - go build -o /dev/null ./cmd
      - go test -vet=off {{.GO_UNIT_PACKAGES}}

  check-full:
    desc: Run check-fast and all remaining owned test suites and contract checks
    env:
      INFRAMILL_TEST_BINARY: '{{.CACHE_ROOT}}/inframill'
      INFRAMILL_TEST_PACKAGE_BUILDER: '{{.CACHE_ROOT}}/blueprint-fixture'
    preconditions:
      - sh: test -x tests/engine/node_modules/.bin/jest
        msg: Run npm --prefix tests/engine ci first.
      - sh: node -e 'if (Number(process.versions.node.split(".")[0]) < 22) process.exit(1)'
        msg: Node.js 22 or newer is required.
    cmds:
      - task: check-fast
      - scripts/spec-check.sh
      - go test -vet=off -tags architecture ./tests/architecture
      - go test -vet=off ./tests/cli/... ./tests/engine/fixture/...
      - task: connect:generate-ts
      - mkdir -p "$(dirname "$INFRAMILL_TEST_BINARY")"
      - CGO_ENABLED=0 go build -trimpath -buildvcs=false -o "$INFRAMILL_TEST_BINARY" ./cmd
      - go build -o "$INFRAMILL_TEST_PACKAGE_BUILDER" ./tests/engine/fixture
      - npm --prefix tests/engine test
      - scripts/check-connect-generated.sh
      - scripts/check-connect-typescript.sh

  # Manual maintainer workflow. Agents must never invoke this task or lint tools.
  lint:
    desc: Manually check Go formatting/lint, protobuf lint, shell syntax and whitespace
    cmds:
      - mkdir -p "$GOCACHE" "$GOLANGCI_LINT_CACHE"
      - golangci-lint fmt --diff {{.GO_SOURCE_ROOTS}}
      - golangci-lint run {{.GO_PACKAGES}}
      - cd connect-rpc && go tool buf lint
      - |
        for script in scripts/*.sh; do
          bash -n "$script" || exit 1
        done
      - git diff --check HEAD

  # Generation only; Go workflows do not require Node or lint tools.
  connect:generate:
    desc: Clean and regenerate Go protobuf/Connect and CLI bindings
    dir: connect-rpc
    cmds:
      - cd .. && go tool buf generate --template connect-rpc/buf.gen.yaml

  connect:generate-ts:
    desc: Clean and regenerate TypeScript bindings (requires npm ci in tests/engine)
    dir: connect-rpc
    preconditions:
      - sh: test -x ../tests/engine/node_modules/.bin/protoc-gen-es
        msg: Run npm --prefix tests/engine ci first.
    cmds:
      - cd .. && go tool buf generate --template connect-rpc/buf.gen.ts.yaml

