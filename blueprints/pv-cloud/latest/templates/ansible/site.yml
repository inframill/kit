---
- name: Prepare guests
  hosts: all
  tags: [always]
  gather_facts: false
  become: true
  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        timeout: 300
    - name: Read guest facts
      ansible.builtin.setup:
    - name: Assert target architecture
      ansible.builtin.assert:
        that: "ansible_facts.architecture == ('aarch64' if kit_architecture == 'arm64' else 'x86_64')"
    - name: Wait for cloud-init
      ansible.builtin.command: timeout 300 cloud-init status --wait
      changed_when: false
      check_mode: false

- name: Configure common services
  hosts: all
  gather_facts: false
  become: true
  roles:
    - role: common
      when: "'common' in group_names"

- name: Configure Docker
  hosts: all
  gather_facts: false
  become: true
  roles:
    - role: docker
      when: "'docker' in group_names"

- name: Configure web services
  hosts: all
  gather_facts: false
  become: true
  roles:
    - role: web
      when: "'web' in group_names"

- name: Configure data services
  hosts: all
  gather_facts: false
  become: true
  roles:
    - role: data
      when: "'data' in group_names"
