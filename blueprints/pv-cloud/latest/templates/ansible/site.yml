---
- name: Prepare guests
  hosts: all
  tags: [always]
  gather_facts: false
  become: true
  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        timeout: 300
    - name: Read guest facts
      ansible.builtin.setup:
    - name: Assert target architecture
      ansible.builtin.assert:
        that: "ansible_facts.architecture == ('aarch64' if kit_architecture == 'arm64' else 'x86_64')"
    - name: Wait for cloud-init
      ansible.builtin.command: timeout 300 cloud-init status --wait
      changed_when: false
      check_mode: false

- name: Configure common services
  hosts: common
  become: true
  roles:
    - common

- name: Configure web services
  hosts: web
  become: true
  roles:
    - web

- name: Configure data services
  hosts: data
  become: true
  roles:
    - data
