api_version: inframill.dev/blueprint/v1
description: pv-cloud

required_secrets:
  - app1-password
  - app2-password
  - cloudflare
  - hetzner
  - inframill-root-token
  - pv-cloud-tls-private-key
  - pv-cloud-registry-token

command_arguments:
  opentofu.init:
    type: object
    additionalProperties: false
  opentofu.validate:
    type: object
    additionalProperties: false
  opentofu.plan:
    type: object
    additionalProperties: false
    properties:
      destroy:
        type: boolean
      refresh_only:
        type: boolean
    not:
      required: [destroy, refresh_only]
      properties:
        destroy:
          const: true
        refresh_only:
          const: true
  opentofu.apply:
    type: object
    additionalProperties: false
    properties:
      plan_id:
        type: string
        pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
        not:
          const: '00000000000000000000000000'
  opentofu.destroy:
    type: object
    additionalProperties: false
    properties:
      plan_id:
        type: string
        pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
        not:
          const: '00000000000000000000000000'
  ansible.inventory:
    type: object
    additionalProperties: false
  ansible.ping:
    type: object
    additionalProperties: false
    properties:
      hosts:
        type: array
        maxItems: 100
        uniqueItems: true
        items:
          type: string
          pattern: '^[a-z][a-z0-9_-]{0,63}$'
  ansible.syntax-check:
    type: object
    additionalProperties: false
    required: [playbook]
    properties:
      playbook:
        type: string
        enum: [site]
  ansible.check:
    type: object
    additionalProperties: false
    required: [playbook]
    properties:
      playbook:
        type: string
        enum: [site]
      hosts:
        type: array
        maxItems: 100
        uniqueItems: true
        items:
          type: string
          pattern: '^[a-z][a-z0-9_-]{0,63}$'
      tags:
        type: array
        maxItems: 100
        uniqueItems: true
        items:
          type: string
          pattern: '^[a-z][a-z0-9_-]{0,63}$'
  ansible.apply:
    type: object
    additionalProperties: false
    properties:
      playbook:
        type: string
        enum: [site]
        default: site
      hosts:
        type: array
        maxItems: 100
        uniqueItems: true
        items:
          type: string
          pattern: '^[a-z][a-z0-9_-]{0,63}$'
      tags:
        type: array
        maxItems: 100
        uniqueItems: true
        items:
          type: string
          pattern: '^[a-z][a-z0-9_-]{0,63}$'
  dispatch.push:
    type: object
    additionalProperties: false
    required: [directory]
    properties:
      directory:
        type: string
        enum: [postgres, inframill]
  dispatch.make:
    type: object
    additionalProperties: false
    required: [directory, target]
    properties:
      directory:
        type: string
        enum: [postgres, inframill]
      target:
        type: string
        enum: [start, status, verify, stop]

values_schema:
  title: pv-cloud Instance
  type: object
  required:
    - network
    - ssh
    - nodes
    - cloudflare
    - ansible
    - inframill
    - tls
  properties:
    tls:
      title: Shared TLS
      type: object
      additionalProperties: false
      required: [certificate]
      properties:
        certificate:
          title: TLS PEM certificate chain
          description: Shared by PostgreSQL and Inframill. Must cover both client-facing hostnames. Store its private key as pv-cloud-tls-private-key.
          type: string
          x-inframill-ui:
            widget: textarea
          minLength: 1
          pattern: '^-----BEGIN CERTIFICATE-----'
    postgres:
      title: PostgreSQL data node
      type: object
      additionalProperties: false
      properties:
        port:
          title: Public PostgreSQL port
          type: integer
          minimum: 1024
          maximum: 65535
          default: 5432
        source_ips:
          title: Allowed external source CIDRs
          description: Defaults to all IPv4 and IPv6 sources. PostgreSQL requires TLS and a database-specific password.
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            minLength: 1
        memory_mb:
          title: PostgreSQL memory budget in MiB
          description: Defaults to host memory minus the larger of 512 MiB or 25 percent. Includes container memory and file cache.
          type: integer
          minimum: 512
        max_connections:
          type: integer
          minimum: 10
          maximum: 500
          default: 50
        work_mem_mb:
          type: integer
          minimum: 1
          maximum: 64
          default: 4
        databases:
          title: Application databases
          description: Defaults to app1 and app2. Each has a same-named owner/login used for application access and migrations.
          type: array
          minItems: 1
          maxItems: 20
          x-inframill-validations:
            - function: unique
              select: name
          items:
            type: object
            additionalProperties: false
            required: [name, password_secret]
            properties:
              name:
                type: string
                pattern: '^[a-z][a-z0-9_]{0,47}$'
                not:
                  anyOf:
                    - enum: [postgres, template0, template1, public]
                    - pattern: '^pg_'
              password_secret:
                title: Namespace password secret
                description: Required for every application database. Defaults use app1-password and app2-password. Never put passwords in Values.
                type: string
                pattern: '^[a-z][a-z0-9_-]{0,127}$'
              connection_limit:
                type: integer
                minimum: 1
                maximum: 495
              statement_timeout_ms:
                type: integer
                minimum: 0
                maximum: 86400000
              lock_timeout_ms:
                type: integer
                minimum: 0
                maximum: 86400000
              idle_transaction_timeout_ms:
                type: integer
                minimum: 0
                maximum: 86400000
    registry:
      title: Container registry login
      description: Optional Docker login on data and worker nodes before installing Compose services.
      type: object
      additionalProperties: false
      required: [host, username]
      properties:
        host:
          title: Registry host
          description: Registry hostname with an optional port, without a URL scheme or repository path.
          type: string
          maxLength: 253
          pattern: '^[a-z0-9]([a-z0-9.-]*[a-z0-9])?(:[0-9]{1,5})?$'
        username:
          title: Registry username
          type: string
          minLength: 1
          maxLength: 256
          pattern: '^\S+$'
    network:
      title: Network
      type: object
      required: [zone, private_networks]
      additionalProperties: false
      properties:
        zone:
          title: Network zone
          type: string
          pattern: ^[a-z][a-z0-9-]+$
        private_networks:
          title: Private networks
          type: array
          x-inframill-validations:
            - function: unique
              select: name
            - function: cidr
              select: cidr
              version: 4
              scope: private
              canonical: true
            - function: cidr_disjoint
              select: cidr
          items:
            $ref: '#/$defs/private_network'
    ssh:
      title: SSH
      type: object
      required: [user, public_keys, source_ips]
      additionalProperties: false
      properties:
        user:
          title: SSH user
          type: string
          pattern: ^[a-z_][a-z0-9_-]{0,31}$
        public_keys:
          title: SSH public keys
          type: array
          minItems: 1
          items:
            type: string
            pattern: ^(ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp(256|384|521)) [A-Za-z0-9+/]+={0,3}( [A-Za-z0-9@._-]+)?$
        source_ips:
          title: SSH source IPs
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
    ansible:
      title: Ansible
      type: object
      required:
        - address_mode
      additionalProperties: false
      properties:
        address_mode:
          title: Address mode
          enum:
            - public_ipv4
            - private_ipv4
    inframill:
      title: Inframill worker deployment
      type: object
      additionalProperties: false
      required: [image]
      properties:
        image:
          title: Kit image
          type: string
          minLength: 1
    nodes:
      title: Nodes
      type: object
      minProperties: 1
      propertyNames:
        pattern: ^[a-z]([a-z0-9-]{0,34}[a-z0-9])?$
        not:
          enum: [all, ungrouped]
      additionalProperties:
        $ref: '#/$defs/node'
    cloudflare:
      title: Cloudflare
      type: object
      required: [zone_id]
      additionalProperties: false
      properties:
        zone_id:
          title: Cloudflare zone ID
          type: string
          pattern: ^[a-f0-9]{32}$
  additionalProperties: false
  $schema: https://json-schema.org/draft/2020-12/schema
  $defs:
    private_network:
      title: Private network
      type: object
      required:
        - name
        - cidr
      properties:
        name:
          title: Name
          type: string
          pattern: ^[a-z][a-z0-9_-]{0,63}$
        cidr:
          title: CIDR
          type: string
      additionalProperties: false
    node:
      title: Node
      type: object
      required:
        - location
        - server_type
        - roles
        - private_networks
        - architecture
        - image
      properties:
        location:
          title: Location
          type: string
          minLength: 1
        server_type:
          title: Server type
          type: string
          minLength: 1
        roles:
          title: Roles
          type: array
          minItems: 1
          items:
            type: string
            pattern: ^(common|docker|web|data|worker)$
          uniqueItems: true
        private_networks:
          title: Private networks
          type: array
          x-inframill-validations:
            - function: unique
            - function: references
              target: network.private_networks
              target_select: name
          items:
            type: string
            pattern: ^[a-z][a-z0-9_-]{0,63}$
        architecture:
          title: Architecture
          enum:
            - arm64
            - amd64
        image:
          title: Image
          enum:
            - ubuntu-24.04
      additionalProperties: false
      allOf:
        - if:
            properties:
              roles:
                contains:
                  enum: [data, worker]
          then:
            properties:
              roles:
                contains:
                  const: docker
        - if:
            properties:
              architecture:
                const: arm64
          then:
            properties:
              server_type:
                pattern: ^cax[0-9]+$
          else:
            properties:
              server_type:
                pattern: ^(cx|cpx|ccx)[0-9]+$

provider_settings:
  opentofu:
    version: '0.4'
    settings:
      id: opentofu
      backend: local
      node_output: inframill_nodes
      artifact: opentofu-nodes-v1.json
      settings_file: kit-provider.json
  ansible:
    version: '0.4'
    settings:
      id: ansible
      producer_id: opentofu
      producer_version: 0.4.0
      artifact: opentofu-nodes-v1.json
      connection: ssh
      host_key_policy: accept-new
      roles:
        - common
        - docker
        - web
        - data
        - worker
      playbooks:
        site: site.yml
      settings_file: kit-provider.json

  dispatch:
    version: '0.1'
    settings:
      id: dispatch
      settings_file: kit-provider.json
      producer_id: opentofu
      producer_version: 0.4.0
      artifact: opentofu-nodes-v1.json
      connection: ssh
      host_key_policy: accept-new

features:
  - network_firewall
  - network_load_balancer
  - workload_server
