---
- name: Install Docker
  ansible.builtin.apt:
    name: docker.io
    state: present
    update_cache: true

- name: Enable Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Gather service status
  ansible.builtin.service_facts:

- name: Verify docker is enabled and running
  ansible.builtin.assert:
    that:
      - "ansible_facts.services['docker.service'].state == 'running'"
      - "ansible_facts.services['docker.service'].status == 'enabled'"
  when: not ansible_check_mode
