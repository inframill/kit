version: '3'

vars:
  PYTHON: '{{default "python3" .PYTHON}}'

tasks:
  default:
    silent: true
    cmds: ['task --list']
  setup:
    desc: Install test dependencies in the local .venv
    cmds:
      - '"{{.PYTHON}}" -m venv .venv'
      - '"./.venv/bin/python" -m pip install -r requirements.txt'
  test:
    desc: Validate local blueprint sources and integration configuration
    cmds: ['"./.venv/bin/python" -m unittest discover -s tests -p "test_*.py"']
