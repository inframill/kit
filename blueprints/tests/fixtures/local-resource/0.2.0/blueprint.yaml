{
  "api_version": "inframill.dev/blueprint/v1",
  "description": "local-resource 0.2.0",
  "values_schema": {
    "$schema": "https://json-schema.org/draft/2020-12/schema",
    "type": "object",
    "additionalProperties": false,
    "required": [
      "architecture"
    ],
    "properties": {
      "architecture": {
        "enum": [
          "amd64",
          "arm64"
        ]
      }
    }
  },
  "driver_settings": {
    "opentofu": {
      "version": "0.2",
      "settings": {
        "id": "opentofu",
        "backend": "local",
        "node_output": "inframill_nodes",
        "artifact": "opentofu-nodes-v1.json",
        "settings_file": "kit-driver.json"
      }
    },
    "ansible": {
      "version": "0.2",
      "settings": {
        "id": "ansible",
        "producer_id": "opentofu",
        "producer_version": "0.2.0",
        "artifact": "opentofu-nodes-v1.json",
        "connection": "local",
        "host_key_policy": "strict",
        "roles": [
          "local"
        ],
        "playbooks": {
          "site": "site.yml"
        },
        "settings_file": "kit-driver.json"
      }
    }
  }
}
